name: Publish

on:
    release:
        types:
            - created
    workflow_dispatch:
        inputs:
            tag:
                description: Existing release tag to publish to npm (e.g. v2.0.0)
                required: true

env:
    RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
    mockserver-test:
        name: Unit Tests
        runs-on: ubuntu-latest
        strategy:
            matrix:
                nodejs: [22, 24, 26]
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ env.RELEASE_TAG }}
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.nodejs }}
            - name: install dependencies
              run: yarn install
            - name: build and run mockserver docker
              run: yarn run docker-build && yarn run docker-run
            - name: run tests
              run: yarn test

    publish-to-npm:
        needs:
            - mockserver-test
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # npm trusted publishing (OIDC), no token secret
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ env.RELEASE_TAG }}
            - name: set version envvar
              run: echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> $GITHUB_ENV
            - name: set release version on package.json
              run: sed -i.bak 's/0\.0\.0/'$RELEASE_VERSION'/g' package.json
            - name: check package
              run: cat package.json
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
            - name: install dependencies
              run: yarn install
            - name: run build
              run: yarn build
            - name: publish to npm
              run: npm publish --access public

    publish-to-docker:
        if: github.event_name == 'release'
        needs:
            - mockserver-test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: set version envvar
              run: echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> $GITHUB_ENV
            - name: set up QEMU
              uses: docker/setup-qemu-action@v4
            - name: set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: log in to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: build and push multi-arch image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: gguridi/mockserver:version-${{ env.RELEASE_VERSION }}
