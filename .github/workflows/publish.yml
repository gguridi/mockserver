name: Publish

on:
    release:
        types:
            - created

jobs:
    mockserver-test:
        name: Unit Tests
        runs-on: ubuntu-latest
        strategy:
            matrix:
                nodejs: [22, 24, 26]
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.nodejs }}
            - name: install dependencies
              run: yarn install
            - name: build and run mockserver docker
              run: yarn run docker-build && yarn run docker-run
            - name: run tests
              run: yarn test

    publish-to-npm:
        needs:
            - mockserver-test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: set version envvar
              run: echo "RELEASE_VERSION=$(echo ${GITHUB_REF:11})" >> $GITHUB_ENV
            - name: set release version on package.json
              run: sed -i.bak 's/0\.0\.0/'$RELEASE_VERSION'/g' package.json
            - name: check package
              run: cat package.json
            - uses: actions/setup-node@v7
              with:
                  node-version: 24
            - name: install dependencies
              run: yarn install
            - name: run build
              run: yarn build
            - uses: JS-DevTools/npm-publish@v4
              with:
                  token: ${{ secrets.NPM_TOKEN }}

    publish-to-docker:
        needs:
            - mockserver-test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - name: set version envvar
              run: echo "RELEASE_VERSION=$(echo ${GITHUB_REF:11})" >> $GITHUB_ENV
            - name: set up QEMU
              uses: docker/setup-qemu-action@v4
            - name: set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: log in to Docker Hub
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: build and push multi-arch image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: gguridi/mockserver:version-${{ env.RELEASE_VERSION }}
